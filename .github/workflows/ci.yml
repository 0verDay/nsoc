name: CI

# 重构文档.md §7 阶段 0：CI 骨架
# 三项检查：分层规则（棘轮）/ 内容一致性 / Godot 脚本解析

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  static-checks:
    name: 静态检查（分层 + 内容）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 分层规则检查（重构文档 §3.2）
        run: python tools/ci/check_layers.py

      - name: 内容与数据一致性检查
        run: python tools/ci/check_content.py

  godot-import:
    name: Godot 导入与脚本解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "下载 $URL"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -n1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: 导入并检查脚本解析
        run: |
          set +e
          "$GODOT_BIN" --headless --path dev_gd/nsoc --import > import.log 2>&1
          code=$?
          set -e
          echo "Godot 退出码: $code"
          tail -n 40 import.log
          # 只把"脚本/场景加载失败"视为错误；证书库、user:// 等环境级报错忽略
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file from path 'res://scenes" import.log; then
            echo "::error::检测到 GDScript 解析或场景加载错误"
            exit 1
          fi

      - name: 上传导入日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: import.log
          if-no-files-found: ignore

  headless-smoke:
    name: Headless 冒烟与确定性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -n1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      # 必须先导入：全新检出没有 .godot/global_script_class_cache.cfg，
      # 否则所有 class_name 都会解析失败（详见 重构文档.md 阶段 0 踩坑记录）。
      - name: 导入预热（建立 class_name 缓存 + 解析检查）
        run: |
          set +e
          timeout 600 "$GODOT_BIN" --headless --path dev_gd/nsoc --import > smoke_import.log 2>&1
          echo "import exit=$?"
          set -e
          if grep -nE "Parse Error|SCRIPT ERROR" smoke_import.log; then
            echo "::error::GDScript 解析失败"
            exit 1
          fi

      - name: 冒烟 + 确定性校验（跑两次比对哈希）
        run: |
          set -euo pipefail
          run_once() {
            timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessBattle.tscn -- \
              --turns=3 --seed=20260101 --watchdog=240 > "$1" 2>&1 || true
          }
          run_once run1.log
          run_once run2.log

          grep -q "SMOKE_RESULT PASS" run1.log || { tail -n 40 run1.log; echo "::error::第一次冒烟未通过"; exit 1; }
          grep -q "SMOKE_RESULT PASS" run2.log || { tail -n 40 run2.log; echo "::error::第二次冒烟未通过"; exit 1; }

          H1="$(grep -E '^STATE_HASH' run1.log | awk '{print $2}')"
          H2="$(grep -E '^STATE_HASH' run2.log | awk '{print $2}')"
          echo "STATE_HASH run1=$H1"
          echo "STATE_HASH run2=$H2"
          if [ "$H1" != "$H2" ]; then
            echo "::error::两次运行状态哈希不一致（desync / 非确定性）"
            diff <(grep -E '^TURN_HASH' run1.log) <(grep -E '^TURN_HASH' run2.log) || true
            exit 1
          fi

      - name: 权威化测试（反作弊断言）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/AuthorityTest.tscn > authority.log 2>&1 || true
          if ! grep -q "AUTHORITY_RESULT PASS" authority.log; then
            grep -E "AUTHORITY_CASE FAIL|AUTHORITY_RESULT" authority.log || true
            echo "::error::权威化测试未通过"
            exit 1
          fi
          grep -E "AUTHORITY_RESULT" authority.log

      - name: 场景装配冒烟（全部 .tscn 可 load + instantiate）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/SceneLoadTest.tscn > scene.log 2>&1 || true
          if ! grep -q "SCENE_RESULT PASS" scene.log; then
            grep -E "SCENE_CASE FAIL|SCENE_RESULT" scene.log || true
            echo "::error::场景装配冒烟未通过"
            exit 1
          fi
          grep -E "SCENE_RESULT" scene.log

      - name: 规则层单元测试
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/RulesTest.tscn > rules.log 2>&1 || true
          if ! grep -q "RULES_RESULT PASS" rules.log; then
            grep -E "RULES_CASE FAIL|RULES_RESULT" rules.log || true
            echo "::error::规则层单元测试未通过"
            exit 1
          fi
          grep -E "RULES_RESULT" rules.log

      - name: 上传冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-logs
          path: |
            smoke_import.log
            run1.log
            run2.log
            authority.log
            scene.log
            rules.log
          if-no-files-found: ignore
