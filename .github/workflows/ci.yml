name: CI

# 重构文档.md §7 阶段 0：CI 骨架
# 三项检查：分层规则（棘轮）/ 内容一致性 / Godot 脚本解析

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  static-checks:
    name: 静态检查（分层 + 内容）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 分层规则检查（重构文档 §3.2）
        run: python tools/ci/check_layers.py

      - name: 内容与数据一致性检查
        run: python tools/ci/check_content.py

  go-server:
    name: Go 中继服务（编译 + 安全策略测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go vet
        run: go vet ./...

      - name: 安全策略测试（重构文档 §4.1 止血）
        run: go test -v ./...

  godot-import:
    name: Godot 导入与脚本解析
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "下载 $URL"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -n1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: 导入并检查脚本解析
        run: |
          set +e
          "$GODOT_BIN" --headless --path dev_gd/nsoc --import > import.log 2>&1
          code=$?
          set -e
          echo "Godot 退出码: $code"
          tail -n 40 import.log
          # 只把"脚本/场景加载失败"视为错误；证书库、user:// 等环境级报错忽略
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file from path 'res://scenes" import.log; then
            echo "::error::检测到 GDScript 解析或场景加载错误"
            exit 1
          fi

      - name: 上传导入日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-import-log
          path: import.log
          if-no-files-found: ignore

  headless-smoke:
    name: Headless 冒烟与确定性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Godot headless
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$URL"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_v*' | head -n1)"
          chmod +x "$BIN"
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      # 必须先导入：全新检出没有 .godot/global_script_class_cache.cfg，
      # 否则所有 class_name 都会解析失败（详见 重构文档.md 阶段 0 踩坑记录）。
      - name: 导入预热（建立 class_name 缓存 + 解析检查）
        run: |
          set +e
          timeout 600 "$GODOT_BIN" --headless --path dev_gd/nsoc --import > smoke_import.log 2>&1
          echo "import exit=$?"
          set -e
          if grep -nE "Parse Error|SCRIPT ERROR" smoke_import.log; then
            echo "::error::GDScript 解析失败"
            exit 1
          fi

      - name: 冒烟 + 确定性校验（跑两次比对哈希）
        run: |
          set -euo pipefail
          run_once() {
            timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessBattle.tscn -- \
              --turns=3 --seed=20260101 --watchdog=240 > "$1" 2>&1 || true
          }
          run_once run1.log
          run_once run2.log

          grep -q "SMOKE_RESULT PASS" run1.log || { tail -n 40 run1.log; echo "::error::第一次冒烟未通过"; exit 1; }
          grep -q "SMOKE_RESULT PASS" run2.log || { tail -n 40 run2.log; echo "::error::第二次冒烟未通过"; exit 1; }

          H1="$(grep -E '^STATE_HASH' run1.log | awk '{print $2}')"
          H2="$(grep -E '^STATE_HASH' run2.log | awk '{print $2}')"
          echo "STATE_HASH run1=$H1"
          echo "STATE_HASH run2=$H2"
          if [ "$H1" != "$H2" ]; then
            echo "::error::两次运行状态哈希不一致（desync / 非确定性）"
            diff <(grep -E '^TURN_HASH' run1.log) <(grep -E '^TURN_HASH' run2.log) || true
            exit 1
          fi

      - name: 权威化测试（反作弊断言）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/AuthorityTest.tscn > authority.log 2>&1 || true
          if ! grep -q "AUTHORITY_RESULT PASS" authority.log; then
            grep -E "AUTHORITY_CASE FAIL|AUTHORITY_RESULT" authority.log || true
            echo "::error::权威化测试未通过"
            exit 1
          fi
          grep -E "AUTHORITY_RESULT" authority.log

      - name: 场景装配冒烟（全部 .tscn 可 load + instantiate）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/SceneLoadTest.tscn > scene.log 2>&1 || true
          if ! grep -q "SCENE_RESULT PASS" scene.log; then
            grep -E "SCENE_CASE FAIL|SCENE_RESULT" scene.log || true
            echo "::error::场景装配冒烟未通过"
            exit 1
          fi
          grep -E "SCENE_RESULT" scene.log

      - name: 规则层单元测试
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/RulesTest.tscn > rules.log 2>&1 || true
          if ! grep -q "RULES_RESULT PASS" rules.log; then
            grep -E "RULES_CASE FAIL|RULES_RESULT" rules.log || true
            echo "::error::规则层单元测试未通过"
            exit 1
          fi
          grep -E "RULES_RESULT" rules.log

      - name: 权威手牌渲染测试（按 card_names 重建手牌区）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HandRenderTest.tscn > hr.log 2>&1 || true
          if ! grep -q "HR_RESULT PASS" hr.log; then
            grep -E "HR_CASE FAIL|HR_RESULT" hr.log || true
            echo "::error::权威手牌渲染测试未通过"
            exit 1
          fi
          grep -E "HR_RESULT" hr.log

      - name: v2 接线测试（auth/* → 镜像 + 本地盘面重绘）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/V2WiringTest.tscn > v2w.log 2>&1 || true
          if ! grep -q "V2W_RESULT PASS" v2w.log; then
            grep -E "V2W_CASE FAIL|V2W_RESULT" v2w.log || true
            echo "::error::v2 接线测试未通过"
            exit 1
          fi
          grep -E "V2W_RESULT" v2w.log

      - name: 权威盘面渲染测试（按 auth/state 重绘本地棋盘）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/AuthBoardRenderTest.tscn > abr.log 2>&1 || true
          if ! grep -q "ABR_RESULT PASS" abr.log; then
            grep -E "ABR_CASE FAIL|ABR_RESULT" abr.log || true
            echo "::error::权威盘面渲染测试未通过"
            exit 1
          fi
          grep -E "ABR_RESULT" abr.log

      - name: v2 战斗客户端测试（意图构造 + 权威镜像）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/V2BattleClientTest.tscn > v2bc.log 2>&1 || true
          if ! grep -q "V2BC_RESULT PASS" v2bc.log; then
            grep -E "V2BC_CASE FAIL|V2BC_RESULT" v2bc.log || true
            echo "::error::v2 战斗客户端测试未通过"
            exit 1
          fi
          grep -E "V2BC_RESULT" v2bc.log

      - name: 权威进程入口测试（注册/开局/意图/tick，无需真实网络）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/AuthorityMainTest.tscn > amain.log 2>&1 || true
          if ! grep -q "AMAIN_RESULT PASS" amain.log; then
            grep -E "AMAIN_CASE FAIL|AMAIN_RESULT" amain.log || true
            echo "::error::权威进程入口测试未通过"
            exit 1
          fi
          grep -E "AMAIN_RESULT" amain.log

      - name: 客户端 v2 传输层测试（意图/权威分发，无需网络）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/NetV2Test.tscn > netv2.log 2>&1 || true
          if ! grep -q "NETV2_RESULT PASS" netv2.log; then
            grep -E "NETV2_CASE FAIL|NETV2_RESULT" netv2.log || true
            echo "::error::客户端 v2 传输层测试未通过"
            exit 1
          fi
          grep -E "NETV2_RESULT" netv2.log

      - name: 无头棋盘测试（纯数据规则，不建 UI 节点）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessBoardTest.tscn > board.log 2>&1 || true
          if ! grep -q "BOARD_RESULT PASS" board.log; then
            grep -E "BOARD_CASE FAIL|BOARD_RESULT" board.log || true
            echo "::error::无头棋盘测试未通过"
            exit 1
          fi
          grep -E "BOARD_RESULT" board.log

      - name: Cell 视图/数据等价测试（CellData 转发属性）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/CellViewTest.tscn > cellview.log 2>&1 || true
          if ! grep -q "CELLVIEW_RESULT PASS" cellview.log; then
            grep -E "CELLVIEW_CASE FAIL|CELLVIEW_RESULT" cellview.log || true
            echo "::error::Cell 视图/数据等价测试未通过"
            exit 1
          fi
          grep -E "CELLVIEW_RESULT" cellview.log

      - name: 无视图装配测试（服务器装配路径）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessSetupTest.tscn > hsetup.log 2>&1 || true
          if ! grep -q "HSETUP_RESULT PASS" hsetup.log; then
            grep -E "HSETUP_CASE FAIL|HSETUP_RESULT" hsetup.log || true
            echo "::error::无视图装配测试未通过"
            exit 1
          fi
          grep -E "HSETUP_RESULT" hsetup.log

      - name: 无头完整攻击结算测试（表现开关关闭）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessCombatTest.tscn > hcombat.log 2>&1 || true
          if ! grep -q "HCOMBAT_RESULT PASS" hcombat.log; then
            grep -E "HCOMBAT_CASE FAIL|HCOMBAT_RESULT" hcombat.log || true
            echo "::error::无头战斗结算测试未通过"
            exit 1
          fi
          grep -E "HCOMBAT_RESULT" hcombat.log

      - name: 权威端棋盘结算测试（服务器裁决落子）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/AuthorityBoardTest.tscn > aboard.log 2>&1 || true
          if ! grep -q "ABOARD_RESULT PASS" aboard.log; then
            grep -E "ABOARD_CASE FAIL|ABOARD_RESULT" aboard.log || true
            echo "::error::权威端棋盘结算测试未通过"
            exit 1
          fi
          grep -E "ABOARD_RESULT" aboard.log

      - name: 服务器会话层测试（反向验证反作弊边界）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/ServerSessionTest.tscn > server.log 2>&1 || true
          if ! grep -q "SERVER_RESULT PASS" server.log; then
            grep -E "SERVER_CASE FAIL|SERVER_RESULT" server.log || true
            echo "::error::服务器会话层测试未通过"
            exit 1
          fi
          grep -E "SERVER_RESULT" server.log

      - name: 多棋盘 PVE 冒烟（TestMain + 6 盘 + AI）
        run: |
          set -euo pipefail
          run_tb() {
            timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessTestBattle.tscn -- \
              --turns=2 --seed=20260101 --watchdog=240 > "$1" 2>&1 || true
          }
          run_tb tb1.log
          run_tb tb2.log
          grep -q "TESTBATTLE_RESULT PASS" tb1.log || { tail -n 40 tb1.log; echo "::error::多棋盘冒烟未通过"; exit 1; }
          grep -q "TESTBATTLE_RESULT PASS" tb2.log || { tail -n 40 tb2.log; echo "::error::多棋盘冒烟第二次未通过"; exit 1; }
          H1="$(grep -E '^STATE_HASH' tb1.log | awk '{print $2}')"
          H2="$(grep -E '^STATE_HASH' tb2.log | awk '{print $2}')"
          echo "multi-board STATE_HASH tb1=$H1 tb2=$H2"
          if [ "$H1" != "$H2" ]; then
            echo "::error::多棋盘路径两次运行状态哈希不一致"
            exit 1
          fi

      - name: 规则层跑在纯数据盘上（不依赖视图节点）
        run: |
          set -euo pipefail
          timeout 300 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/RulesOnDataTest.tscn > rod.log 2>&1 || true
          if ! grep -q "ROD_RESULT PASS" rod.log; then
            grep -E "ROD_CASE FAIL|ROD_RESULT" rod.log || true
            echo "::error::规则层纯数据盘测试未通过"
            exit 1
          fi
          grep -E "ROD_RESULT" rod.log

      - name: PVP 三路径冒烟（1v1 / 1v3 / 3v3，真实 TestMain 场景 + 确定性替身）
        run: |
          set -euo pipefail
          run_pvp() {
            timeout 600 "$GODOT_BIN" --headless --path dev_gd/nsoc res://tests/HeadlessPvp.tscn -- \
              --turns=2 --watchdog=480 > "$1" 2>&1 || true
          }
          run_pvp pvp1.log
          run_pvp pvp2.log
          grep -q "PVP_RESULT PASS" pvp1.log || {
            grep -E "PVP_CASE FAIL|PVP_RESULT" pvp1.log || true
            tail -n 40 pvp1.log
            echo "::error::PVP 三路径冒烟未通过"
            exit 1
          }
          grep -q "PVP_RESULT PASS" pvp2.log || { tail -n 40 pvp2.log; echo "::error::PVP 冒烟第二次未通过"; exit 1; }
          for c in 1v1 1v3 3v3; do
            H1="$(grep -E "^PVP_HASH $c " pvp1.log | awk '{print $3}')"
            H2="$(grep -E "^PVP_HASH $c " pvp2.log | awk '{print $3}')"
            echo "PVP $c STATE_HASH $H1 / $H2"
            if [ -z "$H1" ] || [ "$H1" != "$H2" ]; then
              echo "::error::PVP $c 两次运行状态哈希不一致"
              exit 1
            fi
          done

      - name: 上传冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-smoke-logs
          path: |
            smoke_import.log
            run1.log
            run2.log
            authority.log
            scene.log
            rules.log
            hr.log
            v2w.log
            abr.log
            v2bc.log
            amain.log
            netv2.log
            board.log
            cellview.log
            hsetup.log
            hcombat.log
            aboard.log
            server.log
            rod.log
            pvp1.log
            pvp2.log
            tb1.log
            tb2.log
          if-no-files-found: ignore
